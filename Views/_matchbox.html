<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Static Ticketify page preview">
  <title>Ticketify | Match card preview</title>
  <link rel="stylesheet" href="../Static/front/styles/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>
<body>
<div class="index-match-box">
    <div class="match-box-header flex">
        <div class="home-team">
            <img class="team-logo" src="../Static/images/teams/1627585464740-logo-FC-Barcelona.png" alt="">
        </div>
        <div class="match-info flex">
            <span class="sport-type">football
            </span>
            <span class="team-names">
                <span>FC Barcelona
                </span>

                -

                <span> Atletico Madrid
                </span>
            </span>
            <span class="fixture-name">Barcelona-Atletico
            </span>
        </div>
        <div class="away-team">
            <img class="team-logo" src="../Static/images/teams/1627585490077-logo-Ateltico-de Madrid.png" alt="">
        </div>
    </div>
    <div class="match-box-details flex">
        <div>
            <div>
                <div>

                    <i class="bi-calendar-fill">
                    </i>
                    <span>Sun Nov 01 2026
                    </span>
                </div>
                <div>

                    <i class="bi-clock-fill">
                    </i>
                    <span>2:10
                    </span>
                </div>
            </div>
        </div>
        <div>
            <div>
                <div>
                    <i class="bi-house-door-fill">
                    </i>
                    <span>Camp Nou
                    </span>
                </div>
                <div>
                    <i class="bi-arrow-up-square-fill">
                    </i>
                    <span>Barcelona Spain
                    </span>
                </div>
            </div>
        </div>
    </div>

        <span class="count-down-title">Ends in:
        </span>
        <span class="countdown countdown-end count-down" data-date="Thu Nov 05 2026 02:10:44 GMT+0300 (East Africa Time)">
            <span id="days">
            </span>

            Days :
            <span id="hours">
            </span>

            Hours :
            <span id="minutes">
            </span>

            Minutes :
            <span id="seconds">
            </span>
            Seconds
        </span>

    <div class="match-box-buttons flex">


            <a class="btn reserve-btn" href="match.html">Reserve
            </a>

    </div>
</div>

<script src="../Static/front/js/uiTools.js"></script>
<script src="../Static/front/js/ui.js"></script>
<script src="../Static/front/js/inputValidators.js"></script>
</body>
</html>
