<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Static/front/styles/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <title>Ticketify | Adminpanel C Stadium</title>
  </head>
  <body class="panel-body">
    <header>
    <nav class="nav primary-color flex">
        <div class="logo">
            <a href="index.html">
                <h3 class="white">Ticketify
                </h3>
            </a>
        </div>
        <ul class="nav-ul flex">
            <li>
                <a class="white navbar-items" href="index.html">Home
                </a>
            </li>
            <li class="navbar-li-sports">
                <a class="white navbar-items" href="#">Sports
                    <span class="bi-chevron-compact-down">
                    </span>
                </a>
                <ul>
                    <li>
                        <a href="index.html?sport=football">Football
                        </a>
                    </li>
                    <li>
                        <a href="index.html?sport=basketball">Basketball
                        </a>
                    </li>
                    <li>
                        <a href="index.html?sport=volleyball">Volleyball
                        </a>
                    </li>
                </ul>
            </li>
            <li class="navbar-li-search">
                <span class="white navbar-items">Search
                </span>
            </li>
        </ul>
        <div class="user-action flex">

                <span class="acoount-btn-nav active-user-action-btn">Account
                    <span class="bi-chevron-compact-down">
                    </span>
                    <ul class="none">
                        <li>
                            <a href="panel_dashboard.html">Panel
                            </a>
                        </li>

                            <li>
                                <a href="adminpanel_dashboard.html">Admin panel
                                </a>
                            </li>

                        <li>
                            <a href="signin.html">Log out
                            </a>
                        </li>
                    </ul>
                </span>

        </div>
        <form class="flex none" id="navbar-search" action="#" method="GET">
            <input type="text" name="filter" placeholder="What are you looking for?">
            <input type="submit" value="search">
        </form>
    </nav>
    <nav class="dashboard-nav">
        <ul class="flex">
            <li>

                    <a class="active" href="adminpanel_dashboard.html">Dashboard
                    </a>
                    <a class="" href="adminpanel_users.html">Users
                    </a>
                    <a class="" href="adminpanel_matches.html">Matches
                    </a>
                    <a class="" href="adminpanel_teams.html">Teams
                    </a>
                    <a class="" href="adminpanel_stadiums.html">Stadiums
                    </a>
                    <a class="" href="adminpanel_competitions.html">Competitions
                    </a>

            </li>
        </ul>
    </nav>
</header>

        <main class="panel-container">
        <section class="details-container">
            <span>Stadium details
            </span>
            <form class="flex" id="stadium-form" action="#" method="POST" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Stadium name">
                <select name="sport">
                    <option value="" disabled selected>Sport
                    </option>
                    <option value="football">Football
                    </option>
                    <option value="basketball">Basketball
                    </option>
                    <option value="volleyball">Volleyball
                    </option>
                </select>
                <div class="location">
                    <select name="country">
                        <option value="country" disabled selected>Country
                        </option>
                        <option value="Spain">Spain
                        </option>
                    </select>
                    <select name="province">
                        <option value="province" disabled selected>Province
                        </option>
                        <option value="Catalunia">Catalunia
                        </option>
                    </select>
                    <select name="city">
                        <option value="city" disabled selected>City
                        </option>
                        <option value="Barcelona">Barcelona
                        </option>
                    </select>
                </div>
                <input type="text" name="address" placeholder="Address">
                <span>Stadium image
                </span>
                <div class="flex">
                    <img class="img-bg" src="https://via.placeholder.com/400x250?text=Stadium+backgorund+image" alt="">
                    <input class="bg-file-input" type="file" src="" alt="" name="bgImage">
                </div>
                <span>Stands details
                </span>
                <div>
                    <input type="text" name="standId" placeholder="Stand ID">
                    <select name="availabilty">
                        <option value="availabilty" disabled selected>Availabilty
                        </option>
                        <option value="true">true
                        </option>
                        <option value="false">false
                        </option>
                    </select>
                    <select name="location">
                        <option value="location" disabled selected>Location
                        </option>
                        <option value="west">West
                        </option>
                        <option value="east">East
                        </option>
                        <option value="north">North
                        </option>
                        <option value="south">South
                        </option>
                    </select>
                    <select name="floor">
                        <option value="floor" disabled selected>Floor
                        </option>
                        <option value>1
                        </option>
                        <option value="2">2
                        </option>
                        <option value="3">3
                        </option>
                        <option value="4">4
                        </option>
                        <option value="5">5
                        </option>
                        <option value="6">6
                        </option>
                        <option value="7">7
                        </option>
                    </select>
                    <input type="number" name="price" placeholder="price">
                    <input type="number" name="capacity" placeholder="capacity">
                    <span id="add-stand-btn">Add stand
                    </span>
                </div>
                <div class="stands-container">
                    <div class="stands-row stands-row-header flex">
                        <div class="columns flex">
                            <div class="column-id header-column column">ID
                            </div>
                            <div class="column-floor header-column column">floor
                            </div>
                            <div class="column-stand header-column column">stand
                            </div>
                            <div class="column-price header-column column">Price
                            </div>
                            <div class="column-availabilty header-column column">Availablity
                            </div>
                            <div class="column-capacity header-column column">Capacity
                            </div>
                        </div>
                    </div>
                </div>
                <input type="submit" value="Create stadium">
            </form>
        </section>
    </main>





    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script src="../Static/front/js/uiTools.js"></script>
    <script src="../Static/front/js/ui.js"></script>
    <script src="../Static/front/js/inputValidators.js"></script>
  </body>
</html>
