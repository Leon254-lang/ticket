    <title>Ticketify | Adminpanel E Match</title>
  </head>
  <body class="panel-body">
    <header>
    <nav class="nav primary-color flex">
        <div class="logo">
            <a href="index.html">
                <h3 class="white">Ticketify
                </h3>
            </a>
        </div>
        <ul class="nav-ul flex">
            <li>
                <a class="white navbar-items" href="index.html">Home
                </a>
            </li>
            <li class="navbar-li-sports">
                <a class="white navbar-items" href="#">Sports
                    <span class="bi-chevron-compact-down">
                    </span>
                </a>
                <ul>
                    <li>
                        <a href="index.html?sport=football">Football
                        </a>
                    </li>
                    <li>
                        <a href="index.html?sport=basketball">Basketball
                        </a>
                    </li>
                    <li>
                        <a href="index.html?sport=volleyball">Volleyball
                        </a>
                    </li>
                </ul>
            </li>
            <li class="navbar-li-search">
                <span class="white navbar-items">Search
                </span>
            </li>
        </ul>
        <div class="user-action flex">

                <span class="acoount-btn-nav active-user-action-btn">Account
                    <span class="bi-chevron-compact-down">
                    </span>
                    <ul class="none">
                        <li>
                            <a href="panel_dashboard.html">Panel
                            </a>
                        </li>

                            <li>
                                <a href="adminpanel_dashboard.html">Admin panel
                                </a>
                            </li>

                        <li>
                            <a href="signin.html">Log out
                            </a>
                        </li>
                    </ul>
                </span>

        </div>
        <form class="flex none" id="navbar-search" action="#" method="GET">
            <input type="text" name="filter" placeholder="What are you looking for?">
            <input type="submit" value="search">
        </form>
    </nav>
    <nav class="dashboard-nav">
        <ul class="flex">
            <li>

                    <a class="active" href="adminpanel_dashboard.html">Dashboard
                    </a>
                    <a class="" href="adminpanel_users.html">Users
                    </a>
                    <a class="" href="adminpanel_matches.html">Matches
                    </a>
                    <a class="" href="adminpanel_teams.html">Teams
                    </a>
                    <a class="" href="adminpanel_stadiums.html">Stadiums
                    </a>
                    <a class="" href="adminpanel_competitions.html">Competitions
                    </a>

            </li>
        </ul>
    </nav>
</header>

        <main class="panel-container">
        <section class="details-container">
            <span>Match details
            </span>
            <form class="flex" action="#" method="POST" enctype="multipart/form-data">
                <div>
                    <input type="text" name="homeTeam" placeholder="Home team ID" value="team-1">
                    <input type="text" name="awayTeam" placeholder="Away team ID" value="team-2">
                    <a class="search-for-btn" href="adminpanel_teams.html" target="_blank">Search for teams
                        <span class="bi-arrow-right">
                        </span>
                    </a>
                </div>
                <div>
                    <input type="text" name="stadium" placeholder="Stadium ID" value="[object Object]">
                    <a class="search-for-btn" href="adminpanel_stadiums.html" target="_blank">Search for stadiums
                        <span class="bi-arrow-right">
                        </span>
                    </a>
                </div>
                <div>
                    <input type="datetime-local" name="visibleDate" placeholder="Visible date" data-date="10/29/2026, 2:10:44 AM">
                    <input type="datetime-local" name="startBuyDate" placeholder="Start buy date" data-date="10/28/2026, 2:10:44 AM">
                    <input type="datetime-local" name="endBuyDate" placeholder="End buy date" data-date="11/5/2026, 2:10:44 AM">
                    <input type="datetime-local" name="matchDate" placeholder="Match date" data-date="11/1/2026, 2:10:44 AM">
                </div>
                <div>
                    <input type="text" name="competition" placeholder="Competition ID" value="[object Object]">
                    <a class="search-for-btn" href="adminpanel_competitions.html" target="_blank">Search for competitions
                        <span class="bi-arrow-right">
                        </span>
                    </a>
                </div>
                <select name="isDisabled">

                        <option value="true">Disabled
                        </option>
                        <option value="false" selected>Active
                        </option>

                </select>
                <input type="text" name="fixture" placeholder="Fixture - EX: week 34" value="Atletico">
                <span>Match cover
                </span>
                <div class="flex">
                    <img class="img-bg" src="../Static/images/matches/1627730136190-match-cover-6102fb-6102fb.jpeg" alt="FC Barcelona - Atletico Madrid match cover image">
                    <input class="bg-file-input" type="file" src="" alt="" name="cover">
                </div>
                <input type="submit" value="Save changes">
            </form>
        </section>
    </main>
    <a class="fixed-delete-btn" href="match.html">Delete match
    </a>





    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script src="../Static/front/js/uiTools.js"></script>
    <script src="../Static/front/js/ui.js"></script>
    <script src="../Static/front/js/inputValidators.js"></script>
  </body>
</html>
