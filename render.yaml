services:
  - type: web
    name: ticketify
    runtime: node
    buildCommand: npm install --include=dev && npm run build && node -e "require('fs').accessSync('client/dist/index.html')"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CONNECTION_STRING
        sync: false
      - key: JWT_SECRET_CODE
        sync: false
